[package]
name = "load_balance"
version = "0.1.0"
edition = "2024"

[dependencies]
async-trait="0.1"
pingora = { version = "0.9.0", features = ["openssl", "lb"] }
tokio = "=1.53.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
bytes = "1"
http = "*"
tikv-jemallocator = "0.7"
ipnet = "2.12.2"
toml = "1.1.8"
serde = { version = "1", features = ["derive"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"


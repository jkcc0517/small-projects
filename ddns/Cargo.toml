[package]
name = "ddns"
version = "0.1.0"
edition = "2021"
authors = ["chin <jkcc0517@gmail.com>"]

[lib]
crate-type = ["cdylib"]

[dependencies]
worker = { version = "0.8", features = ['http', 'd1'] }
worker-macros = { version = "0.8", features = ['http'] }
http = "1.3"
serde = "1.0.229"
serde_json = "1.0.154"
time = { version = "0.3", features = ["wasm-bindgen", "parsing", "formatting"] }
base64 = "0.23.1"
ed25519-dalek = "3.0.0"
pem = "4.0.0"
anyhow = "1.0.104"
sha2 = "0.11.1"
hex = "0.4.3"
